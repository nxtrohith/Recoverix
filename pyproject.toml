[project]
name = "recoverix-graph"
version = "0.1.0"
description = "NetworkX graph layer for Recoverix intelligent shipment recovery"
requires-python = ">=3.11"
dependencies = [
    "pymongo",
    "dnspython",
    "python-dotenv",
    "networkx",
    "pandas",
    "pyvis",
    "geopy",
    "fastapi",
    "uvicorn[standard]",
    "typesafe-sdk>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph"]
