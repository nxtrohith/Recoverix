<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telangana Logistics Network — 3D Simulation</title>
    <meta name="description" content="Academic 3D logistics simulation of the Telangana hub network. Powered by SimPy and NetworkX." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ═══════════════════════════════════════════════════════════════
         DESIGN TOKENS — Earthy Academic Palette
         ═══════════════════════════════════════════════════════════════ */
      :root {
        /* Core palette */
        --bone:       #E5D7C4;
        --tan:        #CFBB99;
        --moss:       #889063;
        --kombu:      #354024;
        --cafe-noir:  #4C3D19;

        /* Derived surfaces */
        --surface-primary:   #EDE0CE;   /* slightly lighter bone */
        --surface-secondary: #CFBB99;   /* tan */
        --surface-dark:      #354024;   /* kombu */
        --surface-border:    rgba(76, 61, 25, 0.20);
        --surface-border-strong: rgba(76, 61, 25, 0.35);

        /* Typography */
        --text-strong:   #4C3D19;   /* Café Noir */
        --text-primary:  #354024;   /* Kombu */
        --text-muted:    #7a6a48;   /* warm mid tone */
        --text-faint:    #a09070;

        /* Status — all muted, natural */
        --status-moving:    #354024;  /* Kombu */
        --status-idle:      #4a7a30;  /* forest green */
        --status-delayed:   #8b5a1a;  /* amber-brown */
        --status-delivered: #5a4a28;  /* dark earth */
        --status-error:     #8b2c2c;  /* muted red */

        /* UI chrome */
        --shadow-sm:  0 1px 3px rgba(76,61,25,0.10), 0 1px 6px rgba(76,61,25,0.06);
        --shadow-md:  0 4px 12px rgba(76,61,25,0.12), 0 1px 4px rgba(76,61,25,0.08);
        --shadow-lg:  0 8px 28px rgba(76,61,25,0.14), 0 2px 8px rgba(76,61,25,0.08);
        --radius-sm:  6px;
        --radius-md:  10px;
        --radius-lg:  14px;

        /* Font stacks */
        --font-serif: 'Source Serif 4', Georgia, serif;
        --font-sans:  'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body, html {
        width: 100%; height: 100%;
        overflow: hidden;
        background: var(--bone);
        font-family: var(--font-sans);
        color: var(--text-primary);
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      /* ── 3D Canvas ─────────────────────────────────────────────── */
      #app { position: absolute; inset: 0; z-index: 1; }

      /* ══════════════════════════════════════════════════════════════
         TOP BAR
         ══════════════════════════════════════════════════════════════ */
      .top-bar {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        z-index: 10;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        pointer-events: none;
      }

      /* Logo / brand */
      .logo-group {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface-primary);
        border: 1px solid var(--surface-border-strong);
        padding: 10px 16px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        pointer-events: auto;
      }

      .logo-emblem {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: var(--kombu);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .logo-emblem svg { display: block; }

      .logo-text h1 {
        font-family: var(--font-serif);
        font-size: 13px;
        font-weight: 700;
        color: var(--cafe-noir);
        letter-spacing: 0.01em;
        line-height: 1.2;
      }

      .logo-text p {
        font-size: 10.5px;
        color: var(--text-muted);
        margin-top: 1px;
        letter-spacing: 0.02em;
      }

      /* Metric cards */
      .metrics-group {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        pointer-events: auto;
      }

      .metric-card {
        background: var(--surface-primary);
        border: 1px solid var(--surface-border-strong);
        padding: 8px 13px;
        border-radius: var(--radius-sm);
        min-width: 86px;
        box-shadow: var(--shadow-sm);
      }

      .metric-label {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 3px;
      }

      .metric-value {
        font-family: var(--font-serif);
        font-size: 22px;
        font-weight: 700;
        color: var(--cafe-noir);
        line-height: 1;
      }

      .metric-card.active-card .metric-value {
        color: var(--status-idle);
      }

      .btn-camera {
        background: var(--surface-primary);
        border: 1px solid var(--surface-border-strong);
        color: var(--text-primary);
        padding: 8px 13px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
        box-shadow: var(--shadow-sm);
        pointer-events: auto;
        font-family: var(--font-sans);
        transition: background 0.15s;
      }
      .btn-camera:hover { background: var(--tan); }

      /* ══════════════════════════════════════════════════════════════
         BOTTOM CONTROLS
         ══════════════════════════════════════════════════════════════ */
      .bottom-bar {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--surface-primary);
        border: 1px solid var(--surface-border-strong);
        padding: 13px 20px;
        border-radius: var(--radius-lg);
        width: 90%;
        max-width: 760px;
        box-shadow: var(--shadow-lg);
      }

      .timeline-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .timeline-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .time-slider {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 5px;
        border-radius: 3px;
        background: var(--tan);
        outline: none;
        cursor: pointer;
      }

      .time-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--kombu);
        cursor: pointer;
        border: 2px solid var(--bone);
        box-shadow: 0 0 0 2px rgba(53,64,36,0.25), 0 1px 3px rgba(0,0,0,0.15);
      }

      .sim-time-tag {
        font-family: var(--font-serif);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--kombu);
        min-width: 108px;
        text-align: right;
        white-space: nowrap;
        font-style: italic;
      }

      .controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .actions-group {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      /* Primary action — Kombu Green */
      .btn-primary {
        background: var(--kombu);
        color: var(--bone);
        border: 1px solid rgba(53,64,36,0.6);
        padding: 7px 18px;
        border-radius: var(--radius-sm);
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        box-shadow: 0 2px 6px rgba(53,64,36,0.30);
        transition: background 0.15s, transform 0.1s;
        font-family: var(--font-sans);
        letter-spacing: 0.02em;
      }
      .btn-primary:hover {
        background: #2a3319;
        transform: translateY(-1px);
      }
      .btn-primary.is-playing {
        background: #6b2c2c;
        border-color: rgba(107,44,44,0.6);
        box-shadow: 0 2px 6px rgba(107,44,44,0.3);
      }
      .btn-primary.is-playing:hover { background: #571e1e; }

      /* Secondary action — bone/tan */
      .btn-secondary {
        background: var(--tan);
        color: var(--cafe-noir);
        border: 1px solid var(--surface-border-strong);
        padding: 7px 13px;
        border-radius: var(--radius-sm);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: var(--font-sans);
        transition: background 0.15s;
      }
      .btn-secondary:hover { background: #c0ab84; }

      /* Speed group */
      .speed-group {
        display: flex;
        align-items: center;
        gap: 2px;
        background: var(--tan);
        padding: 3px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--surface-border);
      }

      .speed-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        padding: 0 6px 0 4px;
        white-space: nowrap;
      }

      .speed-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 4px 9px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        font-family: var(--font-sans);
        transition: background 0.12s, color 0.12s;
      }
      .speed-btn:hover { background: rgba(76,61,25,0.12); color: var(--text-strong); }
      .speed-btn.active { background: var(--kombu); color: var(--bone); }

      /* ══════════════════════════════════════════════════════════════
         EVENT FEED PANEL (bottom-right)
         ══════════════════════════════════════════════════════════════ */
      .event-panel {
        position: absolute;
        bottom: 108px;
        right: 14px;
        z-index: 10;
        width: 300px;
        max-height: 290px;
        background: var(--surface-primary);
        border: 1px solid var(--surface-border-strong);
        border-radius: var(--radius-md);
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }

      .event-panel-header {
        padding: 9px 13px;
        background: var(--kombu);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .event-panel-title {
        font-family: var(--font-serif);
        font-size: 12px;
        font-weight: 700;
        color: var(--bone);
        letter-spacing: 0.03em;
      }

      .live-indicator {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 9.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tan);
      }

      .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7ab850;
        animation: livePulse 2s ease-in-out infinite;
      }

      @keyframes livePulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }

      .event-log-container {
        padding: 7px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex: 1;
      }

      /* Event items */
      .event-item {
        background: var(--bone);
        border: 1px solid var(--surface-border);
        border-left: 3px solid var(--moss);
        border-radius: var(--radius-sm);
        padding: 6px 9px;
        font-size: 11px;
      }

      .event-item.status-delivered { border-left-color: var(--status-delivered); }
      .event-item.status-delayed   { border-left-color: var(--status-delayed); }
      .event-item.status-idle      { border-left-color: var(--status-idle); }
      .event-item.status-error     { border-left-color: var(--status-error); }

      .event-time-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 2px;
      }

      .event-time {
        font-family: var(--font-serif);
        font-size: 10px;
        font-weight: 600;
        font-style: italic;
        color: var(--text-muted);
        background: var(--tan);
        padding: 1px 5px;
        border-radius: 3px;
        white-space: nowrap;
      }

      .event-type {
        font-size: 9.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--kombu);
      }

      .event-truck-id {
        font-family: var(--font-serif);
        font-size: 12px;
        font-weight: 700;
        color: var(--cafe-noir);
        margin-bottom: 1px;
      }

      .event-route {
        font-size: 10.5px;
        color: var(--text-muted);
        font-style: italic;
      }

      .event-warning {
        font-size: 10px;
        color: var(--status-delayed);
        font-weight: 600;
        margin-top: 2px;
      }

      /* Scrollbar */
      .event-log-container::-webkit-scrollbar { width: 4px; }
      .event-log-container::-webkit-scrollbar-track { background: transparent; }
      .event-log-container::-webkit-scrollbar-thumb { background: var(--tan); border-radius: 2px; }

      /* ══════════════════════════════════════════════════════════════
         HUB TOOLTIP
         ══════════════════════════════════════════════════════════════ */
      .hub-tooltip {
        position: absolute;
        display: none;
        z-index: 100;
        background: var(--surface-primary);
        border: 1px solid var(--surface-border-strong);
        border-top: 3px solid var(--kombu);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        pointer-events: none;
        font-size: 11.5px;
        box-shadow: var(--shadow-lg);
        min-width: 185px;
      }

      .tooltip-title {
        font-family: var(--font-serif);
        font-weight: 700;
        color: var(--cafe-noir);
        margin-bottom: 7px;
        font-size: 13px;
        line-height: 1.2;
      }

      .tooltip-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 3px;
        gap: 8px;
      }

      .tooltip-key {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .tooltip-val {
        font-size: 11.5px;
        color: var(--kombu);
        font-weight: 600;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <!-- 3D Canvas -->
    <div id="app"></div>

    <!-- ── Top Bar ──────────────────────────────────────────────── -->
    <div class="top-bar">
      <div class="logo-group">
        <div class="logo-emblem">
          <!-- Simple map-pin / hub icon -->
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="3" y="3" width="5" height="5" rx="1" fill="#CFBB99"/>
            <rect x="10" y="3" width="5" height="5" rx="1" fill="#889063"/>
            <rect x="3" y="10" width="5" height="5" rx="1" fill="#889063"/>
            <rect x="10" y="10" width="5" height="5" rx="1" fill="#CFBB99"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Telangana Logistics Network</h1>
          <p>3D Simulation · SimPy + NetworkX</p>
        </div>
      </div>

      <div class="metrics-group">
        <div class="metric-card active-card">
          <div class="metric-label">Active Trucks</div>
          <div class="metric-value" id="activeTrucksDisplay">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Hubs</div>
          <div class="metric-value" id="totalNodesDisplay">91</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Network Legs</div>
          <div class="metric-value" id="totalEdgesDisplay">143</div>
        </div>
        <button id="resetCameraBtn" class="btn-camera" title="Reset camera">
          ◎ Focus
        </button>
      </div>
    </div>

    <!-- ── Simulation Controls ───────────────────────────────────── -->
    <div class="bottom-bar">
      <div class="timeline-row">
        <span class="timeline-label">Timeline</span>
        <input
          type="range"
          id="timeSlider"
          class="time-slider"
          min="0"
          max="500"
          step="0.1"
          value="0"
        />
        <div class="sim-time-tag" id="simTimeDisplay">T + 0.0 min</div>
      </div>

      <div class="controls-row">
        <div class="actions-group">
          <button id="playPauseBtn" class="btn-primary">
            <span class="icon">▶</span> Play
          </button>
          <button id="resetBtn" class="btn-secondary">↺ Reset</button>
        </div>

        <div class="speed-group">
          <span class="speed-label">Speed</span>
          <button class="speed-btn" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="5">5×</button>
          <button class="speed-btn active" data-speed="10">10×</button>
          <button class="speed-btn" data-speed="25">25×</button>
          <button class="speed-btn" data-speed="50">50×</button>
          <button class="speed-btn" data-speed="100">100×</button>
        </div>
      </div>
    </div>

    <!-- ── SimPy Event Feed ──────────────────────────────────────── -->
    <div class="event-panel">
      <div class="event-panel-header">
        <span class="event-panel-title">Operations Log</span>
        <div class="live-indicator">
          <div class="live-dot"></div>
          Live
        </div>
      </div>
      <div id="eventLog" class="event-log-container"></div>
    </div>

    <!-- ── Hub Tooltip ───────────────────────────────────────────── -->
    <div id="hubTooltip" class="hub-tooltip"></div>

    <script type="module" src="/frontend/main.ts"></script>
  </body>
</html>
