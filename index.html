<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telangana Logistics Piggybacking Simulator - 3D Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #070b14;
        --surface-glass: rgba(15, 23, 42, 0.78);
        --surface-border: rgba(56, 189, 248, 0.22);
        --accent-cyan: #38bdf8;
        --accent-blue: #0284c7;
        --accent-emerald: #10b981;
        --accent-amber: #f59e0b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-color);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-primary);
        user-select: none;
      }

      #app {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* Top Dashboard Bar */
      .top-bar {
        position: absolute;
        top: 18px;
        left: 20px;
        right: 20px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
      }

      .logo-group {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--surface-glass);
        backdrop-filter: blur(14px);
        border: 1px solid var(--surface-border);
        padding: 10px 18px;
        border-radius: 12px;
        pointer-events: auto;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }

      .logo-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: var(--accent-cyan);
        box-shadow: 0 0 12px var(--accent-cyan);
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.6; }
      }

      .logo-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #fff;
      }

      .logo-subtitle {
        font-size: 11px;
        color: var(--text-secondary);
        letter-spacing: 0.02em;
      }

      .metrics-group {
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }

      .metric-badge {
        display: flex;
        flex-direction: column;
        background: var(--surface-glass);
        backdrop-filter: blur(14px);
        border: 1px solid var(--surface-border);
        padding: 8px 16px;
        border-radius: 10px;
        min-width: 90px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .metric-badge.highlight {
        border-color: rgba(16, 185, 129, 0.45);
      }

      .metric-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
      }

      .metric-value {
        font-size: 18px;
        font-weight: 700;
        color: #ffffff;
        font-family: 'JetBrains Mono', monospace;
      }

      .metric-badge.highlight .metric-value {
        color: var(--accent-emerald);
      }

      .btn-camera {
        background: var(--surface-glass);
        backdrop-filter: blur(14px);
        border: 1px solid var(--surface-border);
        color: var(--text-primary);
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
        pointer-events: auto;
      }

      .btn-camera:hover {
        background: rgba(56, 189, 248, 0.18);
        border-color: var(--accent-cyan);
      }

      /* Bottom Control Panel */
      .bottom-bar {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--surface-glass);
        backdrop-filter: blur(16px);
        border: 1px solid var(--surface-border);
        padding: 14px 22px;
        border-radius: 16px;
        width: 90%;
        max-width: 780px;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
      }

      .timeline-row {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
      }

      .time-slider {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        border-radius: 4px;
        background: #1e293b;
        outline: none;
        cursor: pointer;
        transition: background 0.2s;
      }

      .time-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--accent-cyan);
        box-shadow: 0 0 10px var(--accent-cyan);
        cursor: pointer;
        border: 2px solid #ffffff;
      }

      .sim-time-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 700;
        color: var(--accent-cyan);
        min-width: 110px;
        text-align: right;
      }

      .controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .actions-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
        color: #fff;
        border: none;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        transition: transform 0.15s, box-shadow 0.15s;
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(2, 132, 199, 0.6);
      }

      .btn-primary.is-playing {
        background: linear-gradient(135deg, #e11d48, #f43f5e);
        box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
      }

      .btn-secondary {
        background: rgba(30, 41, 59, 0.85);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-secondary:hover {
        background: rgba(51, 65, 85, 0.85);
        border-color: var(--accent-cyan);
      }

      .speed-group {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(15, 23, 42, 0.6);
        padding: 3px 6px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .speed-label {
        font-size: 11px;
        color: var(--text-secondary);
        margin-right: 4px;
      }

      .speed-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'JetBrains Mono', monospace;
        transition: all 0.15s;
      }

      .speed-btn:hover {
        color: #fff;
      }

      .speed-btn.active {
        background: var(--accent-blue);
        color: #fff;
      }

      /* Floating Event Log (bottom-right) */
      .event-panel {
        position: absolute;
        bottom: 120px;
        right: 20px;
        z-index: 10;
        width: 320px;
        max-height: 240px;
        background: var(--surface-glass);
        backdrop-filter: blur(16px);
        border: 1px solid var(--surface-border);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      .event-panel-header {
        padding: 10px 14px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .event-log-container {
        padding: 8px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .event-item {
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 11px;
      }

      .event-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
      }

      .event-time {
        font-family: 'JetBrains Mono', monospace;
        color: var(--accent-cyan);
        font-size: 10px;
        font-weight: 600;
      }

      .event-badge {
        border: 1px solid;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 9px;
        font-weight: 700;
      }

      .event-truck {
        font-weight: 600;
        color: #ffffff;
      }

      .event-body {
        color: var(--text-secondary);
        display: flex;
        justify-content: space-between;
      }

      .event-reason {
        color: var(--accent-amber);
      }

      /* Tooltip */
      .hub-tooltip {
        position: absolute;
        display: none;
        z-index: 100;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(12px);
        border: 1px solid var(--accent-cyan);
        padding: 10px 14px;
        border-radius: 10px;
        pointer-events: none;
        font-size: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      }

      .tooltip-title {
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 6px;
        font-size: 13px;
      }

      .tooltip-detail {
        color: var(--text-secondary);
        margin-bottom: 2px;
      }

      .tooltip-detail span {
        color: var(--accent-cyan);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="app"></div>

    <!-- Top Navigation & Stats Bar -->
    <div class="top-bar">
      <div class="logo-group">
        <div class="logo-indicator"></div>
        <div>
          <div class="logo-title">Logistics 3D Simulation</div>
          <div class="logo-subtitle">Telangana Hub Network • Powered by SimPy</div>
        </div>
      </div>

      <div class="metrics-group">
        <div class="metric-badge highlight">
          <span class="metric-label">Active Trucks</span>
          <span class="metric-value" id="activeTrucksDisplay">0</span>
        </div>
        <div class="metric-badge">
          <span class="metric-label">Hubs Rendered</span>
          <span class="metric-value" id="totalNodesDisplay">91</span>
        </div>
        <div class="metric-badge">
          <span class="metric-label">Network Legs</span>
          <span class="metric-value" id="totalEdgesDisplay">143</span>
        </div>
        <button id="resetCameraBtn" class="btn-camera" title="Reset camera viewpoint">
          <span>🎯</span> Focus Map
        </button>
      </div>
    </div>

    <!-- Bottom Simulation Control Bar -->
    <div class="bottom-bar">
      <div class="timeline-row">
        <input
          type="range"
          id="timeSlider"
          class="time-slider"
          min="0"
          max="500"
          step="0.1"
          value="0"
        />
        <div class="sim-time-tag" id="simTimeDisplay">T + 0.0 min</div>
      </div>

      <div class="controls-row">
        <div class="actions-group">
          <button id="playPauseBtn" class="btn-primary">
            <span class="icon">▶</span> Play
          </button>
          <button id="resetBtn" class="btn-secondary">↺ Reset</button>
        </div>

        <div class="speed-group">
          <span class="speed-label">Speed:</span>
          <button class="speed-btn" data-speed="1">1x</button>
          <button class="speed-btn" data-speed="5">5x</button>
          <button class="speed-btn active" data-speed="10">10x</button>
          <button class="speed-btn" data-speed="25">25x</button>
          <button class="speed-btn" data-speed="50">50x</button>
          <button class="speed-btn" data-speed="100">100x</button>
        </div>
      </div>
    </div>

    <!-- Floating Live Event Feed -->
    <div class="event-panel">
      <div class="event-panel-header">
        <span>SimPy Event Feed</span>
        <span style="color: var(--accent-cyan); font-size: 10px;">LIVE</span>
      </div>
      <div id="eventLog" class="event-log-container"></div>
    </div>

    <!-- Interactive Hub Tooltip -->
    <div id="hubTooltip" class="hub-tooltip"></div>

    <!-- Application Script -->
    <script type="module" src="/frontend/main.ts"></script>
  </body>
</html>
